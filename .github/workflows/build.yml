---
name: Build checked export
'on':
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # setup-go v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.4'
          cache: false
      # setup-uv v10.3.3
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.13.7'
          enable-cache: true
          cache-local-path: .cache/uv
          cache-dependency-glob: tools/pack/uv.lock
      - name: Build and verify export
        run: make pack-sync build
      - name: Check release version and integration title
        if: >-
          ${{ github.event_name == 'pull_request'
              || github.ref == 'refs/heads/main' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: make release-check
      # upload-artifact v7.0.2 (immutable artifacts)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: >-
          ${{ success() && github.event_name == 'push'
              && github.ref == 'refs/heads/main' }}
        with:
          name: release-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/*.mrpack*
          if-no-files-found: error
          retention-days: 90
