---
name: Publish Modrinth
'on':
  workflow_call:
    secrets:
      RELEASE_TOKEN:
        required: false
      MODRINTH_TOKEN:
        required: false
permissions:
  contents: read
jobs:
  modrinth:
    if: ${{ vars.MODRINTH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      # setup-uv v10.3.3
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.13.7'
          enable-cache: true
          cache-local-path: .cache/uv
          cache-dependency-glob: tools/pack/uv.lock
      - name: Publish verified GitHub asset to Modrinth
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          MODRINTH_DISCLOSURES_CONFIRMED: >-
            ${{ vars.MODRINTH_DISCLOSURES_CONFIRMED }}
          MODRINTH_PROFILE_ENABLED: ${{ vars.MODRINTH_PROFILE_ENABLED }}
        run: make pack-sync release-modrinth
