---
name: Verify pack
run-name: ${{ github.event_name }} ${{ github.event.before }}..${{ github.sha }}
'on':
  push:
    branches: ['**']
  pull_request:
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
jobs:
  check:
    uses: ./.github/workflows/check.yml
  build:
    needs: check
    uses: ./.github/workflows/build.yml
