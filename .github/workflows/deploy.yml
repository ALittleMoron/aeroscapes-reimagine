---
name: Deploy documentation
'on':
  workflow_call:
    inputs:
      commit:
        type: string
        required: true
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    env:
      DOCS_SITE: https://${{ github.repository_owner }}.github.io
      DOCS_BASE: /${{ github.event.repository.name }}/
      DOCS_COMMIT: ${{ inputs.commit }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      # setup-node v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: tools/docs/.node-version
      - run: make ci-npm
      # setup-uv v10.3.3
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.13.7'
          enable-cache: false
      - run: make sync
      - name: Render published release status
        id: status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make release-docs
      - name: Validate published documentation
        if: ${{ steps.status.outputs.deploy == 'true' }}
        run: make docs-format docs-check
      # upload-pages-artifact v5.0.0
      - uses: >-
          actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        if: ${{ steps.status.outputs.deploy == 'true' }}
        with:
          path: tools/docs/dist
      - name: Check main immediately before deployment
        id: current
        if: ${{ steps.status.outputs.deploy == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make release-docs-current
      - name: Publish documentation
        id: deployment
        if: ${{ steps.current.outputs.deploy == 'true' }}
        # deploy-pages v5.0.1
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
