---
name: Deploy documentation
'on':
  workflow_call:
    inputs:
      commit:
        type: string
        required: true
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    env:
      DOCS_SITE: https://${{ github.repository_owner }}.github.io
      DOCS_BASE: /${{ github.event.repository.name }}/
      DOCS_COMMIT: ${{ inputs.commit }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6
        with:
          node-version-file: tools/docs/.node-version
      # setup-uv v10.3.2
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: '0.13.1'
          enable-cache: false
      - run: make sync
      - name: Render published release status
        id: status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make release-docs
      - name: Validate published documentation
        if: ${{ steps.status.outputs.deploy == 'true' }}
        run: make docs-format docs-check
      # upload-pages-artifact v4
      - uses: >-
          actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        if: ${{ steps.status.outputs.deploy == 'true' }}
        with:
          path: tools/docs/dist
      - name: Check main immediately before deployment
        id: current
        if: ${{ steps.status.outputs.deploy == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make release-docs-current
      - name: Publish documentation
        id: deployment
        if: ${{ steps.current.outputs.deploy == 'true' }}
        # deploy-pages v4
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
